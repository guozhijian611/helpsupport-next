openapi: 3.0.3
info:
  title: 帮助中心 - 注册接口
  description: 用户通过邮箱注册账号，支持患者和医生两种角色。医生注册需上传资格证书并等待审核。
  version: 1.1.0

servers:
  - url: http://127.0.0.1:8787
    description: 本地开发环境

paths:
  /app/help/auth/register:
    post:
      summary: 邮箱注册
      description: |
        使用邮箱注册新账号，注册前需先调用 [发送邮箱验证码](/app/help/auth/sendEmail) 接口获取验证码。

        **注册流程：**
        1. 调用 `sendEmail` 接口发送验证码（type=1）
        2. 用户填写注册信息和收到的验证码
        3. 调用本接口完成注册

        **角色说明：**
        - `role=1`（患者，默认）— 注册后可直接登录
        - `role=2`（医生）— 需上传资格证书图片，注册后等待管理员审核通过才能登录

        **业务规则：**
        - 邮箱和用户名均不能与已有账号重复
        - 邮箱验证码有效期为 **10分钟**
        - 密码长度不少于 6 位
        - 医生角色必须上传至少一张资格证书图片
      operationId: register
      tags:
        - 用户认证
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - username
                - password
                - email_code
              properties:
                email:
                  type: string
                  format: email
                  description: 注册邮箱地址
                  example: "newuser@example.com"
                username:
                  type: string
                  description: 用户名，不能与已有账号重复
                  example: "newuser"
                password:
                  type: string
                  description: 用户密码，长度不少于6位
                  minLength: 6
                  example: "123456"
                email_code:
                  type: string
                  description: 邮箱收到的6位数字验证码
                  example: "386521"
                role:
                  type: integer
                  description: |
                    用户角色：
                    - `1` — 患者（默认）
                    - `2` — 医生（需上传证书，审核后才能登录）
                  enum: [1, 2]
                  default: 1
                  example: 1
                certification_images:
                  type: string
                  description: |
                    资格证书图片 URL 数组（JSON 字符串），医生注册时必填。
                    先调用 [上传图片](/app/help/system/uploadImage) 接口上传证书图片获取 URL。
                    示例：`["https://example.com/cert1.jpg","https://example.com/cert2.jpg"]`
                  example: '["https://example.com/uploads/cert1.jpg","https://example.com/uploads/cert2.jpg"]'
      responses:
        "200":
          description: 请求响应
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                患者注册成功:
                  summary: 患者注册成功，可直接登录
                  value:
                    code: 200
                    message: "注册成功"
                    data: null
                医生注册成功:
                  summary: 医生注册成功，需等待审核
                  value:
                    code: 200
                    message: "注册成功，请等待资质审核"
                    data: null
                邮箱格式错误:
                  summary: 邮箱格式不正确
                  value:
                    code: 400
                    message: "请输入正确的邮箱格式"
                    data: null
                用户名为空:
                  summary: 未输入用户名
                  value:
                    code: 400
                    message: "请输入用户名"
                    data: null
                密码过短:
                  summary: 密码长度不足
                  value:
                    code: 400
                    message: "密码长度不能少于6位"
                    data: null
                验证码为空:
                  summary: 未输入验证码
                  value:
                    code: 400
                    message: "请输入邮箱验证码"
                    data: null
                医生缺少证书:
                  summary: 医生注册未上传证书
                  value:
                    code: 400
                    message: "医生注册需上传资格证书"
                    data: null
                账号已存在:
                  summary: 邮箱或用户名已被注册
                  value:
                    code: 500
                    message: "邮箱或者账号已存在"
                    data: null
                验证码错误:
                  summary: 验证码输入错误或已过期
                  value:
                    code: 500
                    message: "验邮箱证码错误或已过期，请填写正确的验证码"
                    data: null

components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          description: '患者返回"注册成功"，医生返回"注册成功，请等待资质审核"'
          example: "注册成功"
        data:
          type: "null"
          example: null

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          enum: [400, 500]
          example: 500
        message:
          type: string
          example: "邮箱或者账号已存在"
        data:
          type: "null"
          example: null
