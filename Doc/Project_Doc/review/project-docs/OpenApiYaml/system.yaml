openapi: 3.0.3
info:
  title: 帮助中心 - 系统接口
  description: 站点配置获取与文件上传接口
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8787
    description: 本地开发环境

paths:
  /app/help/system/siteInfo:
    get:
      summary: 获取站点配置
      description: |
        获取站点基本配置信息，包括站点名称、Logo、描述、关键词、版权信息、备案号、联系方式等。
        数据来源于 `sa_site_info` 表（id=1）。
      operationId: getSiteInfo
      tags:
        - 系统配置
      responses:
        "200":
          description: 请求响应
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SiteInfoSuccessResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                获取成功:
                  summary: 成功获取站点配置
                  value:
                    code: 200
                    message: success
                    data:
                      id: 1
                      site_name: "HelpSupport"
                      site_logo: "https://example.com/logo.png"
                      site_desc: "开箱即用的高质量帮助支持系统"
                      site_keywords: "帮助中心,客服,支持"
                      site_copyright: "Copyright © 2026"
                      site_record_number: "粤ICP备XXXXXXXX号"
                      site_config: ""
                      contact: "15888888888"
                      remark: ""
                      create_time: "2026-01-18 21:09:49"
                      update_time: "2026-03-06 07:13:36"
                站点信息不存在:
                  summary: 站点信息未配置
                  value:
                    code: 404
                    message: "站点信息读取失败"
                    data: null

  /app/help/system/uploadImage:
    post:
      summary: 上传图片
      description: |
        上传图片文件，支持 jpg、jpeg、png、gif、webp 等常见图片格式。

        **存储模式：**
        - `system` — 使用系统配置的存储方式（默认，可能是 OSS/COS 等云存储）
        - `local` — 强制使用本地存储
      operationId: uploadImage
      tags:
        - 文件上传
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件
                mode:
                  type: string
                  description: |
                    存储模式：
                    - `system` — 系统配置的存储方式（默认）
                    - `local` — 本地存储
                  enum: ["system", "local"]
                  default: "system"
                  example: "system"
      responses:
        "200":
          description: 请求响应
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UploadSuccessResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                上传成功:
                  summary: 图片上传成功
                  value:
                    code: 200
                    message: success
                    data:
                      url: "https://example.com/uploads/2026/03/06/image.png"
                      filename: "image.png"
                      size: 102400

  /app/help/system/uploadFile:
    post:
      summary: 上传文件
      description: |
        上传通用文件，支持文档、压缩包等各类文件格式。

        **存储模式：**
        - `system` — 使用系统配置的存储方式（默认）
        - `local` — 强制使用本地存储
      operationId: uploadFile
      tags:
        - 文件上传
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 上传的文件
                mode:
                  type: string
                  description: |
                    存储模式：
                    - `system` — 系统配置的存储方式（默认）
                    - `local` — 本地存储
                  enum: ["system", "local"]
                  default: "system"
                  example: "system"
      responses:
        "200":
          description: 请求响应
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UploadSuccessResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                上传成功:
                  summary: 文件上传成功
                  value:
                    code: 200
                    message: success
                    data:
                      url: "https://example.com/uploads/2026/03/06/document.pdf"
                      filename: "document.pdf"
                      size: 512000

components:
  schemas:
    SiteInfoData:
      type: object
      description: 站点配置数据
      properties:
        id:
          type: integer
          example: 1
        site_name:
          type: string
          description: 站点名称
          example: "HelpSupport"
        site_logo:
          type: string
          description: 站点 Logo URL
          example: "https://example.com/logo.png"
        site_desc:
          type: string
          description: 站点描述
          example: "开箱即用的高质量帮助支持系统"
        site_keywords:
          type: string
          description: 站点关键词
          example: "帮助中心,客服,支持"
        site_copyright:
          type: string
          description: 版权信息
          example: "Copyright © 2026"
        site_record_number:
          type: string
          description: 备案号
          example: "粤ICP备XXXXXXXX号"
        site_config:
          type: string
          description: 站点配置（JSON）
        contact:
          type: string
          description: 联系方式
          example: "15888888888"
        remark:
          type: string
          description: 备注

    UploadData:
      type: object
      description: 上传结果数据
      properties:
        url:
          type: string
          description: 文件访问 URL
          example: "https://example.com/uploads/2026/03/06/image.png"
        filename:
          type: string
          description: 文件名
          example: "image.png"
        size:
          type: integer
          description: 文件大小（字节）
          example: 102400

    SiteInfoSuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/SiteInfoData"

    UploadSuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/UploadData"

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          enum: [404, 500]
          example: 500
        message:
          type: string
          example: "操作失败"
        data:
          type: "null"
          example: null
