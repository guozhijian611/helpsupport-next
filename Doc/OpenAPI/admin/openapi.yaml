openapi: 3.0.3
info:
  title: B8AIadmin SaiAdmin 后台接口
  version: 1.0.0
  description: |
    基于 SaiAdmin 插件源码整理的后台管理端 OpenAPI 文档。
    路由来源为 server/plugin/saiadmin/config/route.php，统一响应结构来源为 plugin\saiadmin\basic\OpenController。
servers:
  - url: /
    description: 当前站点根地址，前端通过 VITE_API_URL 配置实际域名
tags:
  - name: Auth
    description: 登录、验证码与当前用户信息
  - name: Dashboard
    description: 工作台统计
  - name: System
    description: 系统通用能力
  - name: User
    description: 用户管理
  - name: Role
    description: 角色管理
  - name: Dept
    description: 部门管理
  - name: Post
    description: 岗位管理
  - name: Menu
    description: 菜单管理
  - name: Dict
    description: 字典管理
  - name: Attachment
    description: 附件和附件分类
  - name: Config
    description: 系统配置
  - name: Logs
    description: 登录日志、操作日志、邮件日志
  - name: Server
    description: 服务监控与缓存
  - name: Database
    description: 数据表维护
  - name: Crontab
    description: 定时任务
  - name: Code
    description: 代码生成
security:
  - bearerAuth: []
paths:
  /core/install:
    get:
      tags: [System]
      summary: 安装页面初始化信息
      security: []
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/install/install:
    post:
      tags: [System]
      summary: 执行系统安装
      security: []
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/captcha:
    get:
      tags: [Auth]
      summary: 获取验证码
      security: []
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/login:
    post:
      tags: [Auth]
      summary: 管理员登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, code, uuid]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                type:
                  type: string
                  default: pc
                code:
                  type: string
                uuid:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/user:
    get:
      tags: [Auth]
      summary: 获取当前管理员信息
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/dictAll:
    get:
      tags: [System]
      summary: 获取全部字典数据
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/menu:
    get:
      tags: [System]
      summary: 获取当前管理员菜单
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/statistics:
    get:
      tags: [Dashboard]
      summary: 工作台基础统计
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/loginChart:
    get:
      tags: [Dashboard]
      summary: 登录统计曲线图
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/loginBarChart:
    get:
      tags: [Dashboard]
      summary: 登录统计柱状图
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/clearAllCache:
    get:
      tags: [System]
      summary: 清除当前管理员缓存
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/getResourceCategory:
    get:
      tags: [Attachment]
      summary: 获取资源分类树
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/getResourceList:
    get:
      tags: [Attachment]
      summary: 获取图片资源列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: origin_name
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/saveNetworkImage:
    post:
      tags: [Attachment]
      summary: 保存网络图片
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/uploadImage:
    post:
      tags: [Attachment]
      summary: 上传图片
      requestBody:
        $ref: "#/components/requestBodies/MultipartUpload"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/uploadFile:
    post:
      tags: [Attachment]
      summary: 上传文件
      requestBody:
        $ref: "#/components/requestBodies/MultipartUpload"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/chunkUpload:
    post:
      tags: [Attachment]
      summary: 切片上传
      requestBody:
        $ref: "#/components/requestBodies/MultipartUpload"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/getUserList:
    get:
      tags: [User]
      summary: 获取可选用户列表
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: dept_id
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/getLoginLogList:
    get:
      tags: [Logs]
      summary: 获取当前管理员登录日志
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/system/getOperationLogList:
    get:
      tags: [Logs]
      summary: 获取当前管理员操作日志
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"

  /core/user/index:
    get:
      tags: [User]
      summary: 用户列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: username
          in: query
          schema:
            type: string
        - name: phone
          in: query
          schema:
            type: string
        - name: dept_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/user/read:
    get:
      tags: [User]
      summary: 读取用户详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/user/save:
    post:
      tags: [User]
      summary: 创建用户
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/user/update:
    put:
      tags: [User]
      summary: 更新用户
      requestBody:
        $ref: "#/components/requestBodies/FreeFormWithId"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/user/destroy:
    delete:
      tags: [User]
      summary: 删除用户
      requestBody:
        $ref: "#/components/requestBodies/Ids"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/user/updateInfo:
    post:
      tags: [User]
      summary: 当前用户修改资料
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/user/modifyPassword:
    post:
      tags: [User]
      summary: 当前用户修改密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/user/clearCache:
    post:
      tags: [User]
      summary: 清理指定用户缓存
      requestBody:
        $ref: "#/components/requestBodies/IdBody"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/user/initUserPassword:
    post:
      tags: [User]
      summary: 重置用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, password]
              properties:
                id:
                  type: integer
                password:
                  type: string
                  format: password
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/user/setHomePage:
    post:
      tags: [User]
      summary: 设置用户首页
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, dashboard]
              properties:
                id:
                  type: integer
                dashboard:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"

  /core/role/index:
    get:
      tags: [Role]
      summary: 角色列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: name
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/role/read:
    get:
      tags: [Role]
      summary: 读取角色详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/role/save:
    post:
      tags: [Role]
      summary: 创建角色
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/role/update:
    put:
      tags: [Role]
      summary: 更新角色
      requestBody:
        $ref: "#/components/requestBodies/FreeFormWithId"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/role/destroy:
    delete:
      tags: [Role]
      summary: 删除角色
      requestBody:
        $ref: "#/components/requestBodies/Ids"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/role/accessRole:
    get:
      tags: [Role]
      summary: 可操作角色列表
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/role/getMenuByRole:
    get:
      tags: [Role]
      summary: 获取角色菜单权限
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/role/menuPermission:
    post:
      tags: [Role]
      summary: 保存角色菜单权限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, menu_ids]
              properties:
                id:
                  type: integer
                menu_ids:
                  type: array
                  items:
                    oneOf:
                      - type: integer
                      - type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/role/getDeptByRole:
    get:
      tags: [Role]
      summary: 获取角色部门数据权限
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/role/dataPermission:
    post:
      tags: [Role]
      summary: 保存角色数据权限
      requestBody:
        $ref: "#/components/requestBodies/FreeFormWithId"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"

  /core/dept/index:
    get:
      tags: [Dept]
      summary: 部门列表
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dept/read:
    get:
      tags: [Dept]
      summary: 读取部门详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dept/save:
    post:
      tags: [Dept]
      summary: 创建部门
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dept/update:
    put:
      tags: [Dept]
      summary: 更新部门
      requestBody:
        $ref: "#/components/requestBodies/FreeFormWithId"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dept/destroy:
    delete:
      tags: [Dept]
      summary: 删除部门
      requestBody:
        $ref: "#/components/requestBodies/Ids"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dept/accessDept:
    get:
      tags: [Dept]
      summary: 可操作部门列表
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"

  /core/post/index:
    get:
      tags: [Post]
      summary: 岗位列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: name
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/post/read:
    get:
      tags: [Post]
      summary: 读取岗位详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/post/save:
    post:
      tags: [Post]
      summary: 创建岗位
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/post/update:
    put:
      tags: [Post]
      summary: 更新岗位
      requestBody:
        $ref: "#/components/requestBodies/FreeFormWithId"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/post/destroy:
    delete:
      tags: [Post]
      summary: 删除岗位
      requestBody:
        $ref: "#/components/requestBodies/Ids"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/post/import:
    post:
      tags: [Post]
      summary: 导入岗位
      requestBody:
        $ref: "#/components/requestBodies/MultipartUpload"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/post/export:
    post:
      tags: [Post]
      summary: 导出岗位
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          description: 导出文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /core/post/downloadTemplate:
    post:
      tags: [Post]
      summary: 下载岗位导入模板
      responses:
        "200":
          description: 模板文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /core/post/accessPost:
    get:
      tags: [Post]
      summary: 可操作岗位列表
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"

  /core/menu/index:
    get:
      tags: [Menu]
      summary: 菜单列表
      parameters:
        - name: title
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/menu/read:
    get:
      tags: [Menu]
      summary: 读取菜单详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/menu/save:
    post:
      tags: [Menu]
      summary: 创建菜单
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/menu/update:
    put:
      tags: [Menu]
      summary: 更新菜单
      requestBody:
        $ref: "#/components/requestBodies/FreeFormWithId"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/menu/destroy:
    delete:
      tags: [Menu]
      summary: 删除菜单
      requestBody:
        $ref: "#/components/requestBodies/Ids"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/menu/accessMenu:
    get:
      tags: [Menu]
      summary: 可操作菜单树
      parameters:
        - name: onlyMenu
          in: query
          schema:
            type: string
        - name: onlyButton
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"

  /core/dictType/index:
    get:
      tags: [Dict]
      summary: 字典类型列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: name
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dictType/save:
    post:
      tags: [Dict]
      summary: 创建字典类型
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dictType/update:
    put:
      tags: [Dict]
      summary: 更新字典类型
      requestBody:
        $ref: "#/components/requestBodies/FreeFormWithId"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dictType/destroy:
    delete:
      tags: [Dict]
      summary: 删除字典类型
      requestBody:
        $ref: "#/components/requestBodies/Ids"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dictData/index:
    get:
      tags: [Dict]
      summary: 字典数据列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: dict_type_id
          in: query
          schema:
            type: string
        - name: label
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dictData/save:
    post:
      tags: [Dict]
      summary: 创建字典数据
      requestBody:
        $ref: "#/components/requestBodies/FreeForm"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dictData/update:
    put:
      tags: [Dict]
      summary: 更新字典数据
      requestBody:
        $ref: "#/components/requestBodies/FreeFormWithId"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/dictData/destroy:
    delete:
      tags: [Dict]
      summary: 删除字典数据
      requestBody:
        $ref: "#/components/requestBodies/Ids"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"

  /core/attachment/index:
    get:
      tags: [Attachment]
      summary: 附件列表
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: origin_name
          in: query
          schema:
            type: string
        - name: storage_mode
          in: query
          schema:
            type: string
        - name: mime_type
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/attachment/update:
    put:
      tags: [Attachment]
      summary: 更新附件
      requestBody:
        $ref: "#/components/requestBodies/FreeFormWithId"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/attachment/destroy:
    delete:
      tags: [Attachment]
      summary: 删除附件
      requestBody:
        $ref: "#/components/requestBodies/Ids"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/attachment/move:
    post:
      tags: [Attachment]
      summary: 移动附件到分类
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, category_id]
              properties:
                ids:
                  type: array
                  items:
                    oneOf:
                      - type: integer
                      - type: string
                category_id:
                  type: integer
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/category/index:
    get:
      tags: [Attachment]
      summary: 附件分类列表
      parameters:
        - name: name
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/category/read:
    get:
      tags: [Attachment]
      summary: 读取附件分类详情
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ApiResponse"
  /core/category/save:
    post:
      tags: [Attachment]
      summary: 创建附件分类
