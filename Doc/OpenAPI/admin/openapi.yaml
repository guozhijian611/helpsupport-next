components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: query
      required: true
      schema:
        oneOf:
          - type: integer
          - type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 15
  requestBodies:
    FreeForm:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    FreeFormWithId:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - type: object
                required: [id]
                properties:
                  id:
                    oneOf:
                      - type: integer
                      - type: string
              - type: object
                additionalProperties: true
    IdBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id:
                oneOf:
                  - type: integer
                  - type: string
    Ids:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      oneOf:
                        - type: integer
                        - type: string
    TableIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [table, ids]
            properties:
              table:
                type: string
              ids:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      oneOf:
                        - type: integer
                        - type: string
    Tables:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tables]
            properties:
              tables:
                type: array
                items:
                  type: string
    MultipartUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: true
            properties:
              file:
                type: string
                format: binary
              mode:
                type: string
                description: system 或 local
  responses:
    ApiResponse:
      description: SaiAdmin 统一 JSON 响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
  schemas:
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          nullable: true
          description: 业务数据，结构由具体接口决定。
    PageData:
      type: object
      properties:
        list:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
