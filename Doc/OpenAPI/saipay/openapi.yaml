{
  "openapi": "3.0.3",
  "info": {
    "title": "B8AIadmin SaiPay 支付插件接口",
    "version": "1.0.0",
    "description": "基于 saipay 插件源码、控制器和前端调用层整理的 OpenAPI 文档。"
  },
  "servers": [
    {
      "url": "/",
      "description": "当前站点根地址，前端通过 VITE_API_URL 配置实际域名"
    }
  ],
  "tags": [
    {
      "name": "支付回调"
    },
    {
      "name": "支付示例"
    },
    {
      "name": "订单记录"
    }
  ],
  "security": [
    {
      "bearerAuth": {}
    }
  ],
  "paths": {
    "/app/saipay/admin/Order/destroy": {
      "delete": {
        "tags": [
          "订单记录"
        ],
        "summary": "订单记录删除",
        "description": "来源：saiadmin-artd/src/views/plugin/saipay/api/order.ts",
        "responses": {
          "200": {
            "$ref": "#/components/responses/ApiResponse"
          }
        },
        "requestBody": {
          "$ref": "#/components/requestBodies/Ids"
        }
      }
    },
    "/app/saipay/admin/Order/index": {
      "get": {
        "tags": [
          "订单记录"
        ],
        "summary": "订单记录列表",
        "description": "来源：saiadmin-artd/src/views/plugin/saipay/api/order.ts",
        "responses": {
          "200": {
            "$ref": "#/components/responses/ApiResponse"
          }
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/Page"
          },
          {
            "$ref": "#/components/parameters/Limit"
          }
        ]
      }
    },
    "/app/saipay/admin/Order/read": {
      "get": {
        "tags": [
          "订单记录"
        ],
        "summary": "订单记录详情",
        "description": "来源：saiadmin-artd/src/views/plugin/saipay/api/order.ts",
        "responses": {
          "200": {
            "$ref": "#/components/responses/ApiResponse"
          }
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/Id"
          }
        ]
      }
    },
    "/app/saipay/admin/Order/refresh": {
      "post": {
        "tags": [
          "订单记录"
        ],
        "summary": "订单记录刷新支付回调",
        "description": "来源：saiadmin-artd/src/views/plugin/saipay/api/order.ts",
        "responses": {
          "200": {
            "$ref": "#/components/responses/ApiResponse"
          }
        },
        "requestBody": {
          "$ref": "#/components/requestBodies/FreeForm"
        }
      }
    },
    "/app/saipay/api/demo/alipayScan": {
      "get": {
        "tags": [
          "支付示例"
        ],
        "summary": "支付示例支付宝扫码支付示例",
        "description": "来源：saiadmin-artd/src/views/plugin/saipay/api/demo.ts",
        "responses": {
          "200": {
            "$ref": "#/components/responses/ApiResponse"
          }
        },
        "security": []
      }
    },
    "/app/saipay/api/demo/payOrder": {
      "post": {
        "tags": [
          "支付示例"
        ],
        "summary": "支付示例继续支付",
        "description": "来源：saiadmin-artd/src/views/plugin/saipay/api/demo.ts",
        "responses": {
          "200": {
            "$ref": "#/components/responses/ApiResponse"
          }
        },
        "requestBody": {
          "$ref": "#/components/requestBodies/FreeForm"
        },
        "security": []
      }
    },
    "/app/saipay/api/demo/wechatScan": {
      "get": {
        "tags": [
          "支付示例"
        ],
        "summary": "支付示例微信扫码支付示例",
        "description": "来源：saiadmin-artd/src/views/plugin/saipay/api/demo.ts",
        "responses": {
          "200": {
            "$ref": "#/components/responses/ApiResponse"
          }
        },
        "security": []
      }
    },
    "/app/saipay/api/notify/alipay": {
      "post": {
        "tags": [
          "支付回调"
        ],
        "summary": "支付回调支付宝支付回调",
        "description": "来源：server/plugin/saipay/app/api/controller/NotifyController.php",
        "responses": {
          "200": {
            "description": "支付平台回调响应",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string",
                  "example": "success"
                }
              }
            }
          }
        },
        "requestBody": {
          "$ref": "#/components/requestBodies/FreeForm"
        },
        "security": []
      }
    },
    "/app/saipay/api/notify/checkOrder": {
      "post": {
        "tags": [
          "支付回调"
        ],
        "summary": "支付回调检查订单状态",
        "description": "来源：server/plugin/saipay/app/api/controller/NotifyController.php",
        "responses": {
          "200": {
            "$ref": "#/components/responses/ApiResponse"
          }
        },
        "requestBody": {
          "$ref": "#/components/requestBodies/FreeForm"
        },
        "security": []
      }
    },
    "/app/saipay/api/notify/unipay": {
      "post": {
        "tags": [
          "支付回调"
        ],
        "summary": "支付回调银联支付回调",
        "description": "来源：server/plugin/saipay/app/api/controller/NotifyController.php",
        "responses": {
          "200": {
            "description": "支付平台回调响应",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string",
                  "example": "success"
                }
              }
            }
          }
        },
        "requestBody": {
          "$ref": "#/components/requestBodies/FreeForm"
        },
        "security": []
      }
    },
    "/app/saipay/api/notify/wechat": {
      "post": {
        "tags": [
          "支付回调"
        ],
        "summary": "支付回调微信支付回调",
        "description": "来源：server/plugin/saipay/app/api/controller/NotifyController.php",
        "responses": {
          "200": {
            "description": "支付平台回调响应",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string",
                  "example": "success"
                }
              }
            }
          }
        },
        "requestBody": {
          "$ref": "#/components/requestBodies/FreeForm"
        },
        "security": []
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "parameters": {
      "Id": {
        "name": "id",
        "in": "query",
        "required": true,
        "schema": {
          "oneOf": [
            {
              "type": "integer"
            },
            {
              "type": "string"
            }
          ]
        }
      },
      "Page": {
        "name": "page",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "default": 1
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "default": 15
        }
      }
    },
    "requestBodies": {
      "FreeForm": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": true
            }
          }
        }
      },
      "Ids": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "required": [
                "ids"
              ],
              "properties": {
                "ids": {
                  "oneOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "array",
                      "items": {
                        "oneOf": [
                          {
                            "type": "integer"
                          },
                          {
                            "type": "string"
                          }
                        ]
                      }
                    }
                  ]
                }
              },
              "additionalProperties": true
            }
          }
        }
      },
      "MultipartUpload": {
        "required": true,
        "content": {
          "multipart/form-data": {
            "schema": {
              "type": "object",
              "additionalProperties": true,
              "properties": {
                "file": {
                  "type": "string",
                  "format": "binary"
                },
                "mode": {
                  "type": "string",
                  "description": "system 或 local"
                }
              }
            }
          }
        }
      }
    },
    "responses": {
      "ApiResponse": {
        "description": "SaiAdmin 统一 JSON 响应",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ApiResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "ApiResponse": {
        "type": "object",
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "integer",
            "example": 200
          },
          "message": {
            "type": "string",
            "example": "success"
          },
          "data": {
            "nullable": true,
            "description": "业务数据，结构由具体接口决定。"
          }
        }
      }
    }
  }
}
