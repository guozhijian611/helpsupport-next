openapi: 3.0.3
info:
  title: 帮助中心 - 协议接口
  description: 获取平台各类使用协议内容，包括用户协议、隐私协议、充值协议、使用协议等
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8787
    description: 本地开发环境

paths:
  /app/help/index/protocol:
    get:
      summary: 获取协议内容
      description: |
        根据协议类型获取对应的协议内容，仅返回状态为启用（status=1）的协议。
        协议内容为 HTML 富文本格式。
      operationId: getProtocol
      tags:
        - 协议管理
      parameters:
        - name: protocol_type
          in: query
          required: true
          description: |
            协议类型，取值说明：
            - `1` — 用户协议
            - `2` — 隐私协议
            - `3` — 充值协议
            - `4` — 使用协议
          schema:
            type: integer
            enum: [1, 2, 3, 4]
          examples:
            用户协议:
              value: 1
              summary: 获取用户协议
            隐私协议:
              value: 2
              summary: 获取隐私协议
            充值协议:
              value: 3
              summary: 获取充值协议
            使用协议:
              value: 4
              summary: 获取使用协议
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/NotFoundResponse"
                  - $ref: "#/components/schemas/BadRequestResponse"
              examples:
                成功返回用户协议:
                  summary: 成功获取用户协议
                  value:
                    code: 200
                    message: success
                    data:
                      id: 1
                      protocol_type: 1
                      title: "用户协议"
                      content: '<p style="text-align: start;">一、协议的接受与变更</p>...'
                成功返回隐私协议:
                  summary: 成功获取隐私协议
                  value:
                    code: 200
                    message: success
                    data:
                      id: 2
                      protocol_type: 2
                      title: "隐私协议"
                      content: '<h3 style="line-height: 2;">《隐私协议》</h3>...'
                成功返回充值协议:
                  summary: 成功获取充值协议
                  value:
                    code: 200
                    message: success
                    data:
                      id: 3
                      protocol_type: 3
                      title: "充值协议"
                      content: '<p style="text-align: start; line-height: 2;">一、协议的确认与接受</p>...'
                成功返回使用协议:
                  summary: 成功获取使用协议
                  value:
                    code: 200
                    message: success
                    data:
                      id: 4
                      protocol_type: 4
                      title: "使用协议"
                      content: '<p style="line-height: 2;"><strong>一、协议的范围</strong></p>...'
                协议不存在:
                  summary: 未找到对应协议
                  value:
                    code: 404
                    message: "未找到对应协议"
                    data: null
                缺少参数:
                  summary: 缺少协议类型参数
                  value:
                    code: 400
                    message: "缺少协议类型参数"
                    data: null

components:
  schemas:
    ProtocolData:
      type: object
      description: 协议数据对象
      properties:
        id:
          type: integer
          description: 协议 ID
          example: 1
        protocol_type:
          type: integer
          description: |
            协议类型：
            - 1 = 用户协议
            - 2 = 隐私协议
            - 3 = 充值协议
            - 4 = 使用协议
          enum: [1, 2, 3, 4]
          example: 1
        title:
          type: string
          description: 协议标题
          example: "用户协议"
        content:
          type: string
          description: 协议内容，HTML 富文本格式
          example: "<p>协议正文内容...</p>"

    SuccessResponse:
      type: object
      description: 成功响应
      properties:
        code:
          type: integer
          description: 状态码
          example: 200
        message:
          type: string
          description: 响应消息
          example: success
        data:
          $ref: "#/components/schemas/ProtocolData"

    NotFoundResponse:
      type: object
      description: 协议不存在
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: "未找到对应协议"
        data:
          type: "null"
          example: null

    BadRequestResponse:
      type: object
      description: 参数缺失
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "缺少协议类型参数"
        data:
          type: "null"
          example: null
