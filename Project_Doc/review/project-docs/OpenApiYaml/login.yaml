openapi: 3.0.3
info:
  title: 帮助中心 - 登录接口
  description: 用户通过邮箱和密码进行登录，登录成功返回 JWT Token 和用户基本信息
  version: 1.1.0

servers:
  - url: http://127.0.0.1:8787
    description: 本地开发环境

paths:
  /app/help/auth/login:
    post:
      summary: 邮箱登录
      description: |
        使用邮箱和密码登录，登录成功返回 JWT Token 和用户基本信息。

        **业务规则：**
        - 通过邮箱查找用户，再验证密码
        - 用户状态为禁用（status=2）时无法登录
        - **医生角色（role=2）需通过资质审核才能登录**
          - 审核状态为 0（待审核）→ 返回 403：资质审核中
          - 审核状态为 2（已拒绝）→ 返回 403：审核未通过+原因
        - 登录成功后更新最后登录时间和 IP
        - Token 有效期由后台配置 `access_exp` 控制，默认 24 小时
      operationId: login
      tags:
        - 用户认证
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: 注册时使用的邮箱地址
                  example: "user@example.com"
                password:
                  type: string
                  description: 用户密码
                  example: "123456"
      responses:
        "200":
          description: 请求响应
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginSuccessResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                登录成功:
                  summary: 登录成功，返回 Token 和用户信息
                  value:
                    code: 200
                    message: success
                    data:
                      token:
                        access_token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                        refresh_token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                        access_exp: 86400
                        refresh_exp: 604800
                      userInfo:
                        id: 1
                        username: "allen"
                        nickname: "未设置"
                        avatar: "https://robohash.org/allen.png"
                        email: "allen@example.com"
                        role: 1
                        certification_status: 1
                邮箱格式错误:
                  summary: 邮箱格式不正确
                  value:
                    code: 400
                    message: "请输入正确的邮箱格式"
                    data: null
                密码为空:
                  summary: 未输入密码
                  value:
                    code: 400
                    message: "请输入密码"
                    data: null
                账号密码错误:
                  summary: 邮箱不存在或密码错误
                  value:
                    code: 500
                    message: "账号或密码错误，请重新输入!"
                    data: null
                医生审核中:
                  summary: 医生资质正在审核
                  value:
                    code: 403
                    message: "您的医生资质正在审核中，请耐心等待"
                    data: null
                医生审核未通过:
                  summary: 医生资质审核被拒绝
                  value:
                    code: 403
                    message: "您的医生资质审核未通过：证书图片不清晰"
                    data: null
                账户被禁用:
                  summary: 用户已被禁止登录
                  value:
                    code: 500
                    message: "您已被禁止登录!"
                    data: null

components:
  schemas:
    TokenData:
      type: object
      description: JWT Token 数据
      properties:
        access_token:
          type: string
          description: 访问令牌
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
        refresh_token:
          type: string
          description: 刷新令牌
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
        access_exp:
          type: integer
          description: access_token 有效期（秒）
          example: 86400
        refresh_exp:
          type: integer
          description: refresh_token 有效期（秒）
          example: 604800

    UserInfoData:
      type: object
      description: 用户基本信息
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "allen"
        nickname:
          type: string
          example: "未设置"
        avatar:
          type: string
          example: "https://robohash.org/allen.png"
        email:
          type: string
          example: "allen@example.com"
        role:
          type: integer
          description: "角色：1=患者, 2=医生"
          enum: [1, 2]
          example: 1
        certification_status:
          type: integer
          description: "审核状态：0=待审核, 1=已通过, 2=已拒绝"
          enum: [0, 1, 2]
          example: 1

    LoginSuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: object
          properties:
            token:
              $ref: "#/components/schemas/TokenData"
            userInfo:
              $ref: "#/components/schemas/UserInfoData"

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          enum: [400, 403, 500]
          example: 500
        message:
          type: string
          example: "账号或密码错误，请重新输入!"
        data:
          type: "null"
          example: null
