def rewriteRepo(repo) {
    if (!(repo instanceof MavenArtifactRepository)) {
        return
    }
    def url = repo.url?.toString() ?: ''
    if (url.contains('plugins.gradle.org')) {
        repo.setUrl('https://maven.aliyun.com/repository/gradle-plugin/')
    } else if (url.contains('repo.maven.apache.org') || url.contains('repo1.maven.org')) {
        repo.setUrl('https://maven.aliyun.com/repository/central/')
    } else if (url.contains('dl.google.com') || url.contains('maven.google.com')) {
        repo.setUrl('https://maven.aliyun.com/repository/google/')
    }
}

def watchRepos(RepositoryHandler repos) {
    repos.whenObjectAdded { rewriteRepo(it) }
    repos.each { rewriteRepo(it) }
}

def watchSettings(settings) {
    watchRepos(settings.pluginManagement.repositories)
    watchRepos(settings.dependencyResolutionManagement.repositories)
}

gradle.beforeSettings { settings ->
    watchSettings(settings)
}

gradle.settingsEvaluated { settings ->
    watchSettings(settings)
}

gradle.beforeProject { project ->
    watchRepos(project.buildscript.repositories)
    watchRepos(project.repositories)
}
